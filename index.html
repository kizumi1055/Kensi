<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郁 × 景</title>

<style>
body {
  margin: 0;
  font-family: "PingFang SC", "Helvetica Neue", sans-serif;
  background: #ffffff;
  color: #111;
  font-weight: 200;
  letter-spacing: 0.5px;
  font-size: 11px;
}

header {
  text-align: center;
  padding: 24px 0;
  border-bottom: 1px solid #e5e5e5;
}

nav a {
  margin: 0 14px;
  text-decoration: none;
  color: #111;
  font-size: 13px;
}

main {
  padding: 48px 24px;
  text-align: center;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
}

h1 {
  font-size: 20px;
  font-weight: 150;
  margin-bottom: 40px;
}

p {
  margin-bottom: 16px;
  line-height: 1.9;
}

.line {
  width: 300px;
  height: 1px;
  background: #ccc;
  margin: 40px auto;
}

.photo {
  width: 55%;
  max-width: 480px;
  margin: 40px auto;
  display: block;
}
/* 图片悬停微动 */
.photo {
  transition: transform 0.8s ease, filter 0.8s ease;
}

.photo:hover {
  transform: scale(1.015);
  filter: brightness(1.03);
}

@media (max-width: 600px) {
  .photo {
    width: 80%;
  }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ===== 高级进入动画 ===== */

/* 文字浮现 */
.fade-up {
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 1.2s ease forwards;
}

/* 图片浮现（更慢一点） */
.fade-photo {
  opacity: 0;
  transform: scale(0.97);
  animation: fadePhoto 1.6s ease forwards;
}

/* 延迟层级 */
.delay-1 { animation-delay: 0.3s; }
.delay-2 { animation-delay: 0.6s; }
.delay-3 { animation-delay: 0.9s; }
.delay-4 { animation-delay: 1.2s; }

/* 动画定义 */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadePhoto {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* 可拖动图片 */
.draggable {
  touch-action: none;
  transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.4s ease;
  will-change: transform, opacity;
}
</style>
</head>

<body>
<header>
  <nav>
    <a href="index.html">首页</a >
    <a href="about.html">关于</a >
    <a href="daily.html">日常</a >
    <a href="crowning.html">冠名</a >
  </nav>
</header>

<main>
  <h1 class="fade-up delay-1">郁 × 景</h1>
  
<img 
  src="img/10.jpg" 
  alt="郁景"
  class="photo draggable"
  id="heroImage">

<p class="fade-up delay-2">这是一个神秘的地方</p>
<p class="fade-up delay-3">不要问为什么</p>
<p class="fade-up delay-4">总之很神秘就对了</p>
<p class="fade-up delay-4">什么？你还是要问为什么</p>
<p class="fade-up delay-4">没有为什么</p>

<img src="img/6.jpg" alt="郁景" class="photo fade-photo delay-3">
  
  <div class="line"></div>

<p class="fade-up delay-4">
  向 郁 而 景 ｜ 向 卿 而 止
</p>
</main>
/* 可拖动图片js */
<script>
const img = document.getElementById('heroImage');

let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;
let dragging = false;

img.addEventListener('touchstart', (e) => {
  dragging = true;
  img.style.transition = 'none';
  img.style.opacity = '0.92';

  startX = e.touches[0].clientX - currentX;
  startY = e.touches[0].clientY - currentY;
});

img.addEventListener('touchmove', (e) => {
  if (!dragging) return;
  e.preventDefault();

  currentX = e.touches[0].clientX - startX;
  currentY = e.touches[0].clientY - startY;

  const rotate = currentX * 0.03;

  img.style.transform = `
    translate(${currentX}px, ${currentY}px)
    rotate(${rotate}deg)
  `;
});

img.addEventListener('touchend', () => {
  dragging = false;

  currentX = 0;
  currentY = 0;

  img.style.transition =
    'transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease';

  img.style.transform = 'translate(0, 0) rotate(0deg)';
  img.style.opacity = '1';
});
</script>
</body>
</html>
