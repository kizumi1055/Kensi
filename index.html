<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郁谦止 × 景卿</title>
<style>
/* 基础样式 */
body {
    font-family: "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-weight: 100;
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    line-height: 1.8;
    scroll-behavior: smooth;
}

/* 顶部导航 */
header {
    position: sticky;
    top: 0;
    background: #fff;
    padding: 1rem 0;
    text-align: center;
    border-bottom: 1px solid #eee;
    z-index: 10;
}
nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #000;
    font-weight: 100;
    transition: color 0.3s;
}
nav a:hover {
    color: #555;
}

/* 页面主要内容 */
main {
    padding: 3rem 2rem;
    max-width: 800px;
    margin: auto;
}

/* 各段落 section */
section {
    margin-bottom: 5rem;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 1s forwards;
}
section:nth-child(1) { animation-delay: 0.3s; }
section:nth-child(2) { animation-delay: 0.6s; }
section:nth-child(3) { animation-delay: 0.9s; }

/* 动画效果 */
@keyframes fadeInUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* 标题样式 */
h1, h2 {
    font-weight: 100;
    letter-spacing: 1px;
}

/* 页脚 */
footer {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid #eee;
    color: #666;
}
</style>
</head>
<body>

<header>
    <h1>郁谦止 × 景卿</h1>
    <nav>
        <a href=" ">首页</a >
        <a href="#story">故事</a >
        <a href="#about">关于</a >
    </nav>
</header>

<main>
    <section id="home">
        <h2>欢迎来到我们的世界</h2>
        <p>这里是郁谦止和景卿的 CP 网站，记录两人的点滴故事与温暖瞬间。</p >
        <p>每一段文字，每一张图片，都是我们共同的回忆与想象。</p >
    </section>

    <section id="story">
        <h2>故事</h2>
        <p>郁谦止总是淡然而坚定，而景卿温柔细腻，他们的相遇像风吹过湖面，轻轻荡起涟漪，却深深打在心底。</p >
        <p>无数次日夜交错，他们在笑与泪中慢慢靠近，彼此成为对方唯一的安稳与温暖。</p >
    </section>

    <section id="about">
        <h2>关于</h2>
        <p>这个网站是为纪念郁谦止与景卿而建的极简风 CP 网站。</p >
        <p>黑与白，是他们故事的纯粹与宁静；细字体，是每一个瞬间的轻声呢喃；简单的动画，是他们微笑的轻盈流动。</p >
    </section>
</main>

<footer>
    <p>© 2025 郁谦止 × 景卿 | 极简 CP 网站</p >
</footer>

</body>
</html>
