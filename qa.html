<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于｜郁 × 景</title>

<style>
body {
  margin: 0;
  font-family: "PingFang SC", sans-serif;
  background: #fff;
  font-weight: 200;
  letter-spacing: 0.5px;
  font-size: 11px;
}

.color-black {
  color: #111111;
}

  /* flex 容器 */
  .flex-line {
    display: flex;
    justify-content: space-between; /* 左右分开 */
    align-items: center;            /* 垂直居中 */
    margin-bottom: 18px;
  }
  
header {
  text-align: center;
  padding: 24px 0;
  border-bottom: 1px solid #e5e5e5;
}

nav a {
  margin: 0 14px;
  text-decoration: none;
  color: #111;
  font-size: 13px;
}

main {
  padding: 48px 24px;
  text-align: center;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
}

h1 {
  font-size: 20px;
  font-weight: 150;
  margin-bottom: 0px;
}
  
h2 {
  font-size: 15px;
  font-weight: 120;
  margin-bottom: 60px;
}

p {
  margin-bottom: 18px;
  line-height: 1.9;
}

.line {
  width: 300px;
  height: 1px;
  background: #ccc;
  margin: 60px auto;
}

.photo {
  width: 55%;
  max-width: 480px;
  margin: 40px auto;
  display: block;
}

/* 关于页面子导航 */
.about-subnav {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 48px 0 32px;
}

.about-subnav a {
  font-size: 13px;
  letter-spacing: 0.1em;
  color: #999;
  text-decoration: none;
  padding-bottom: 6px;
  border-bottom: 1px solid transparent;
  transition: all 0.3s ease;
}

/* 悬停效果 */
.about-subnav a:hover {
  color: #555;
}

/* 当前页提示 */
.about-subnav a.active {
  color: #111;
  border-bottom: 1px solid #111;
}

/* 正文区域 */
.about-content {
  max-width: 640px;
  margin: 0 auto;
  font-size: 14px;
  line-height: 1.9;
}

/* Q&A 整体 */
.qa-list {
  max-width: 640px;
  margin: 0 auto;
  font-size: 13px;
}

/* 单条 Q&A */
.qa-item {
  border-bottom: 1px solid #eee;
  padding: 16px 0;
}

/* 问题 */
.qa-question {
  cursor: pointer;
  color: #222;
  letter-spacing: 0.05em;
  position: relative;
  font-size: 12px;      /* 👈 字变小 */
  line-height: 1.6;     /* 👈 行距拉开 */
}

/* 小箭头 */
.qa-question::after {
  content: "＋";
  position: absolute;
  right: 0;
  color: #999;
  transition: transform 0.3s ease;
}

/* 展开时箭头变化 */
.qa-item.open .qa-question::after {
  content: "－";
}

/* 答案（默认隐藏） */
.qa-answer {
  max-height: 0;
  overflow: hidden;
  color: #666;
  font-size: 11px;
  line-height: 2.0;
  padding-right: 16px;

  opacity: 0;
  transform: translateY(-6px);

  transition:
  max-height 0.55s cubic-bezier(0.4, 0, 0.2, 1),
  opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
  transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 展开答案 */
.qa-item.open .qa-answer {
  max-height: 400px;
  opacity: 1;
  transform: translateY(0);
  margin-top: 14px;
}

/* 答案（一行一行浮现） */
.qa-answer p {
  opacity: 0;
  transform: translateY(-6px);
  transition:
    opacity 0.4s ease,
    transform 0.4s ease;
}
/* Q&A展开时依次出现 */
.qa-item.open .qa-answer p {
  opacity: 1;
  transform: translateY(0);
}
/* 每一行错位延迟 */
.qa-item.open .qa-answer p:nth-child(1) {
  transition-delay: 0.05s;
}
.qa-item.open .qa-answer p:nth-child(2) {
  transition-delay: 0.15s;
}
.qa-item.open .qa-answer p:nth-child(3) {
  transition-delay: 0.25s;
}
.qa-item.open .qa-answer p:nth-child(4) {
  transition-delay: 0.35s;
}
.qa-item.open .qa-answer p:nth-child(5) {
  transition-delay: 0.45s;
}

@media (max-width: 600px) {
  .photo {
    width: 80%;
  }
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>
<header>
  <nav>

  </nav>
</header>

<main>

<div class="about-subnav">

   <p class="flex-line">

 <img src="img/9.jpg" alt="郁景" class="photo">

<script>
  document.querySelectorAll('.qa-question').forEach(question => {
    question.addEventListener('click', () => {
      const item = question.parentElement;
      item.classList.toggle('open');
    });
  });
</script>
</body>
</html>
