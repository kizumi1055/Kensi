<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冠名｜郁 × 景</title>

<style>
body {
  margin: 0;
  font-family: "PingFang SC", sans-serif;
  background: #fff;
  color: #111;
  font-weight: 200;
  letter-spacing: 0.5px;
  font-size: 11px;
}

header {
  text-align: center;
  padding: 24px 0;
  border-bottom: 1px solid #e5e5e5;
}

nav a {
  margin: 0 14px;
  text-decoration: none;
  color: #111;
  font-size: 13px;
}

main {
  padding: 48px 24px;
  text-align: center;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
}

h2 {
  font-size: 20px;
  font-weight: 150;
  margin-bottom: 40px;
}

p {
  margin-bottom: 18px;
  line-height: 1.9;
}

@media (max-width: 600px) {
  .photo {
    width: 80%;
  }
}
  
@keyframes fadeIn {
  to { opacity: 1; }
}

.thumb-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 24px;
  max-width: 720px;
  margin: 0 auto;
}

.thumb-grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  cursor: pointer;
  filter: grayscale(100%);
}

/* 大图查看器 */
#viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.4s ease;
}

#viewer.show {
  opacity: 1;
}

#viewer img {
  max-width: 90%;
  max-height: 90%;
  filter: none;              /* 大图不灰色 */
}
</style>
</head>

<body>
  
<header>
  <nav>
    <a href="index.html">首页</a >
    <a href="about.html">关于</a >
    <a href="daily.html">日常</a >
    <a href="crowning.html">冠名</a >
  </nav>
</header>

<main>
  <h2>冠名</h2>

  <p>
    放一些冠名卡
  </p >
  <p>
    GNW
  </p >

<div class="thumb-grid">
  <img src="img/gnw1.jpg" onclick="openViewer(this)">
  <img src="img/gnw2.jpg" onclick="openViewer(this)">
  <img src="img/gnw3.jpg" onclick="openViewer(this)">
  <img src="img/gnw4.jpg" onclick="openViewer(this)">
  <img src="img/gnw5.jpg" onclick="openViewer(this)">
  <img src="img/gnw6.jpg" onclick="openViewer(this)">
  <img src="img/gnw7.jpg" onclick="openViewer(this)">
  <img src="img/gnw8.jpg" onclick="openViewer(this)">
  <img src="img/gnw9.jpg" onclick="openViewer(this)">
  <img src="img/gnw10.jpg" onclick="openViewer(this)">
  <img src="img/gnw11.jpg" onclick="openViewer(this)">
  <img src="img/gnw12.jpg" onclick="openViewer(this)">
</div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewer-img">
</div>
  
  <p>
    信纸
  </p >
  <p>
    十年
  </p >
</main>

<script>
/* ====== 点击缩略图，打开大图 ====== */
function openViewer(img) {
  const viewer = document.getElementById("viewer");
  const viewerImg = document.getElementById("viewer-img");
  if (!viewer || !viewerImg) {
    alert("viewer 或 viewer-img 没找到");
    return;
  }
  viewerImg.src = img.src;
  viewer.style.display = "flex";
  // 强制浏览器刷新一次样式（避免动画不触发）
  viewer.offsetHeight;
  viewer.classList.add("show");
}
/* ====== 点击遮罩，关闭大图 ====== */
function closeViewer() {
  const viewer = document.getElementById("viewer");
  if (!viewer) return;
  viewer.classList.remove("show");
  setTimeout(() => {
    viewer.style.display = "none";
  }, 300);
}
</script>
  
</body>
</html>
